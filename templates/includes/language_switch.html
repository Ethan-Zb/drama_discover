{% load i18n %}{% get_current_language as selected_language %}<form class="language-switch" method="post" action="{% url 'set_language' %}" aria-label="{% translate 'Choose language' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" name="language" value="zh-hans" lang="zh-Hans" aria-pressed="{% if selected_language == 'zh-hans' %}true{% else %}false{% endif %}">中文</button><span aria-hidden="true">/</span><button type="submit" name="language" value="en" lang="en" aria-pressed="{% if selected_language == 'en' %}true{% else %}false{% endif %}">EN</button></form>
