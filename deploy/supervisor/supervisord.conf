; Based on the supplied shared Supervisor configuration.
; If /etc/supervisord.conf already manages other projects, retain it and its programs.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/data/supervisor_log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=warn
pidfile=/var/run/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files=/data/supervisor_ini/*.ini
