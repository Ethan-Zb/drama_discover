; Dedicated Supervisor instance. Do not also load the program in another daemon.
[unix_http_server]
file=/run/short-drama-supervisor/supervisor.sock
chmod=0700

[supervisord]
user=root
nodaemon=false
pidfile=/run/short-drama-supervisor/supervisord.pid
logfile=/var/log/short-drama/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
childlogdir=/var/log/short-drama

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/short-drama-supervisor/supervisor.sock

[program:short-drama]
directory=/srv/short-drama
command=/srv/venvs/short-drama/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 --timeout 60 --graceful-timeout 30 --access-logfile - --error-logfile -
user=shortdrama
environment=APP_ENV="production",DJANGO_SETTINGS_MODULE="config.settings",PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=45
stopasgroup=true
killasgroup=true
umask=027
stdout_logfile=/var/log/short-drama/access.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/short-drama/error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
