[program:short-drama]
directory=/data/services/drama_discover
command=/usr/local/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 --timeout 60 --graceful-timeout 30 --access-logfile - --error-logfile -
user=root
environment=APP_ENV="production",DJANGO_SETTINGS_MODULE="config.settings",PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=45
stopasgroup=true
killasgroup=true
umask=027
stdout_logfile=/data/supervisor_log/drama_discover_access.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/data/supervisor_log/drama_discover_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
